[project]
name = "jal-drishti-backend"
version = "0.1.0"
description = "Jal-Drishti urban flood nowcasting and emergency response backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "passlib[bcrypt]>=1.7,<2",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "networkx>=3.3,<4",
  "shapely>=2.0,<3",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "geoalchemy2>=0.15,<1"]
worker = ["redis>=5,<6", "celery>=5.4,<6"]
ml = ["numpy>=2,<3", "scikit-learn>=1.5,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
